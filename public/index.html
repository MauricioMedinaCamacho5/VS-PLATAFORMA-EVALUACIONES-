<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluaciones en línea</title>
    <script>
        const accessParams = new URLSearchParams(window.location.search);
        const isAccessPage = ['registrar', 'unirse', 'salida'].some(parameter => accessParams.has(parameter));
        const destination = isAccessPage ? 'login.html' : 'index.php';
        if (window.location.protocol !== 'file:') {
            window.location.replace(`${destination}${window.location.search}${window.location.hash}`);
        }
    </script>
</head>
<body>
    <p>La página principal necesita Apache y PHP. Inicia el servidor y abre la aplicación. <a href="index.php">Continuar</a>.</p>
</body>
</html>
